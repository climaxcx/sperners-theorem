name = "SpernersTheorem"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SpernersTheorem"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # personal project: no mathlib-style copyright header
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "SpernersTheorem"
